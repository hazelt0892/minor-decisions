{% extends "layout.html" %}

{% block title %}
    {{ tree[0]["title"] }}
{% endblock %}

{% block main %}
    <main id="main_tree">
        <div id="question-box" data-slug="{{ slug }}">
            <div id="verdict-box">
                <h1 id="tree-title">{{ tree[0]["title"] }}</h1>
                <h1 id="verdict">Verdict:</h1>
            </div>
            <div id="qna">
                <h1 id="question"></h1>
                <div id="answers"></div>
            </div>
            <div id="buttons">
                <button id="back">&#8592 Back</button>
                <form action="/">
                    <button id="exit">Exit</button>
                </form>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='tree.js') }}"></script>
{% endblock %}
